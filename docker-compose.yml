version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: estoque_db
    environment:
      POSTGRES_USER: estoque_user
      POSTGRES_PASSWORD: estoque_password
      POSTGRES_DB: estoque_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - estoque_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estoque_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://estoque_user:estoque_password@postgres:5432/estoque_db
      JWT_SECRET: seu_jwt_secret_aqui
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./backend/src:/app/src
    networks:
      - estoque_network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: estoque_frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - estoque_network
    command: npm start

volumes:
  postgres_data:

networks:
  estoque_network:
    driver: bridge
